# 테스트 전용 설정 (datasource는 TestcontainersConfiguration의 @ServiceConnection이 채움)

# 테스트마다 스키마를 새로 만들고 끝나면 삭제
spring.jpa.hibernate.ddl-auto=create-drop

# DATETIME 저장·조회 시 서울 시간대 기준
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 카카오 OAuth 더미 값(테스트는 실제 카카오를 호출하지 않음)
kakao.oauth.client-id=test-client-id
kakao.oauth.client-secret=test-client-secret
kakao.oauth.redirect-uri=http://localhost:8080/api/auth/kakao/callback
