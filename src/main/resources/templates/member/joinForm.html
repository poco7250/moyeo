<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow">
    <h1>회원가입</h1>

    <form th:action="@{/members/join}" th:object="${joinRequest}" method="post" novalidate>
        <!-- 특정 필드에 속하지 않는 에러(중복 등) -->
        <div class="alert" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="field">
            <label for="email">이메일</label>
            <input type="email" id="email" th:field="*{email}" th:errorclass="invalid">
            <p class="error" th:errors="*{email}"></p>
        </div>

        <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" th:errorclass="invalid">
            <p class="error" th:errors="*{password}"></p>
        </div>

        <div class="field">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" th:errorclass="invalid">
            <p class="error" th:errors="*{passwordConfirm}"></p>
        </div>

        <div class="field">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" th:field="*{nickname}" th:errorclass="invalid">
            <p class="error" th:errors="*{nickname}"></p>
        </div>

        <button type="submit" class="btn">가입하기</button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
