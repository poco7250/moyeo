spring.application.name=moyeo

# 프로필을 따로 지정하지 않으면 local로 실행
spring.profiles.default=local

# 뷰 렌더링 중 지연 로딩 쿼리가 나가지 않도록 트랜잭션 밖에서는 영속성 컨텍스트를 닫음
spring.jpa.open-in-view=false

# 카카오 OAuth (실제 값은 application-local.properties 또는 환경 변수로 주입, 커밋 금지)
kakao.oauth.client-id=${KAKAO_CLIENT_ID:}
kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.oauth.redirect-uri=${KAKAO_REDIRECT_URI:}

# 자체 JWT 서명 키(32바이트 이상). 로컬은 application-local.properties, 운영은 환경 변수 JWT_SECRET으로 주입, 커밋 금지
auth.jwt.secret=${JWT_SECRET:}

# 인증 쿠키. Secure 기본 true라 로컬 http 개발에서는 application-local.properties에 auth.cookie.secure=false가 필요
# domain은 PRD 오픈 이슈 1(SPA 배포 방식) 결정 뒤 채운다(비우면 Domain 속성 없음)
#auth.cookie.domain=
#auth.cookie.secure=true
