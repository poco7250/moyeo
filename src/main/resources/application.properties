spring.application.name=moyeo

# 프로필을 따로 지정하지 않으면 local로 실행(로컬 설정은 jar 밖 ./config/application-local.properties, 운영은 SPRING_PROFILES_ACTIVE를 명시)
spring.profiles.default=local

# 뷰 렌더링 중 지연 로딩 쿼리가 나가지 않도록 트랜잭션 밖에서는 영속성 컨텍스트를 닫음
spring.jpa.open-in-view=false

# 스키마는 Flyway(src/main/resources/db/migration)가 만들고 Hibernate는 엔티티와 맞는지 검사만 한다(Task 067)
# 엔티티 컬럼·제약을 바꾸면 V{n}__설명.sql을 새로 추가한다. 이미 적용된 파일은 고치지 않는다
spring.jpa.hibernate.ddl-auto=validate

# DATETIME 저장·조회 시 서울 시간대 기준(테스트와 같음)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 리버스 프록시(Caddy)가 TLS를 끝내므로 X-Forwarded-Proto/Host를 원래 요청으로 반영한다
# 없으면 WebSocket Origin 검사(https 오리진 vs http 요청)가 같은 출처로 안 보인다
server.forward-headers-strategy=native

# 헬스 체크(docker compose healthcheck)만 노출. 프록시는 /actuator를 넘기지 않는다
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# 금액 같은 정수 필드에 소수(1.5)가 오면 잘라서 받지 않고 400으로 거부한다(Jackson 기본값은 잘라서 허용)
spring.jackson.deserialization.accept-float-as-int=false

# 카카오 OAuth (실제 값은 config/application-local.properties 또는 환경 변수로 주입, 커밋 금지)
kakao.oauth.client-id=${KAKAO_CLIENT_ID:}
kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.oauth.redirect-uri=${KAKAO_REDIRECT_URI:}

# 카카오 로컬(장소 검색) REST 키. 카카오 REST API 키 = OAuth client-id라 따로 안 주면 KAKAO_CLIENT_ID를 쓴다. 커밋 금지
kakao.local.rest-api-key=${KAKAO_REST_API_KEY:${KAKAO_CLIENT_ID:}}

# 장소 검색 회원별 빈도 제한(PRD 미정, Task 015에서 결정: 1분에 30회). 메모리 기준이라 단일 인스턴스 전제
#place.search.rate-limit.max-requests=30
#place.search.rate-limit.window=1m

# 장소 투표 마감 처리 주기(기본 30초). "-"면 스케줄을 끈다. 여러 인스턴스가 돌아도 Round.version 낙관적 락으로 한 번만 반영된다
#place.vote-closer.cron=*/30 * * * * *

# 자체 JWT 서명 키(32바이트 이상). 로컬은 config/application-local.properties, 운영은 환경 변수 JWT_SECRET으로 주입, 커밋 금지
auth.jwt.secret=${JWT_SECRET:}

# 배포 구조(PRD 오픈 이슈 1 종결, 2026-11-22): React(Vite) 정적 SPA와 API를 같은 도메인에 두고 리버스 프록시가 경로로 나눈다
# (/api·/ws·/share → Spring, 나머지 → SPA). 그래서 CORS·쿠키 Domain·리다이렉트 오리진은 비워 둔다

# 인증 쿠키. Secure 기본 true라 로컬 http 개발에서는 config/application-local.properties에 auth.cookie.secure=false가 필요
# domain은 같은 도메인 배포라 비운다(Domain 속성 없음 = 그 호스트 전용)
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
#auth.cookie.domain=

# 로그인 후 리다이렉트. 같은 도메인 배포라 frontend-base-url은 비워 같은 오리진의 상대 경로(예: /invites/abc)로 보낸다
#auth.redirect.frontend-base-url=
#auth.redirect.default-path=/

# 초대 링크·모임 상세 링크 앞부분. 비우면 /invites/{token}·/meetings/{id} 상대 경로
# 카톡 공유 문구에 들어가므로 운영은 APP_BASE_URL(예: https://moyeo.example.com)을 준다. 초대 만료 기본 7일(Task 008)
group.invite.base-url=${APP_BASE_URL:}
meeting.link.base-url=${APP_BASE_URL:}
#group.invite.ttl=7d

# 공유 링크(OG 메타 HTML, /share/**) 앞부분. 비우면 og:url이 절대 주소가 되지 않으니 운영은 꼭 준다(같은 도메인이라 APP_BASE_URL과 같음)
share.base-url=${APP_BASE_URL:}

# WebSocket 핸드셰이크 허용 오리진(쉼표 구분 패턴). 비우면 같은 오리진만 허용 — 같은 도메인 배포라 기본은 비움
realtime.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:}

# 영수증 사진 업로드 크기(PRD S-1 확장, Task 049 결정: 10MB). 요청 크기는 multipart 헤더 여유분을 더한다
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# 영수증 사진 로컬 저장 위치(기본 ./data/receipts, 실행 위치 기준·gitignore 대상). 운영은 도커 볼륨(/app/data/receipts)
# VM 1대 배포(Task 067)라 로컬 디스크를 유지한다. 인스턴스를 늘리면 S3 등 ReceiptStorage 구현으로 바꾼다
receipt.storage.local-base-dir=${RECEIPT_STORAGE_DIR:./data/receipts}

# 송금 계좌번호 암호화 키(PRD G-5·S-7, Task 048). Base64로 인코딩한 32바이트(예: openssl rand -base64 32). 없으면 기동 실패
# 로컬은 config/application-local.properties, 운영은 환경 변수 PAYMENT_ENCRYPTION_KEY로 주입, 커밋 금지. 키를 잃으면 저장된 계좌번호를 복구할 수 없다
payment.crypto.encryption-key=${PAYMENT_ENCRYPTION_KEY:}

# 웹 푸시 VAPID 키(PRD 6장 PWA 웹 푸시, Task 056). base64url raw P-256 키 쌍(공개 65바이트·개인 32바이트)
# 생성 예: npx web-push generate-vapid-keys. 비우면 서버는 뜨지만 푸시를 보내지 않고 공개키 API는 503
# 로컬은 config/application-local.properties, 운영은 환경 변수로 주입, 개인키 커밋 금지. 키를 바꾸면 기존 브라우저 구독은 다시 받아야 한다
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:mailto:admin@moyeo.invalid}
